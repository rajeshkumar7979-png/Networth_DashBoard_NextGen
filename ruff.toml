# Line length is not a logic failure. CI still fails on unused imports,
# undefined names, and the other Pyflakes checks.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
"pages/*.py" = ["E211", "E231", "E402", "E701", "E702", "W291", "F401", "F841"]
"lib/valuation.py" = ["F821"]
"lib/history.py" = ["F401"]
"scripts/*.py" = ["F401"]
