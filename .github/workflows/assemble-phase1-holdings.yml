name: Assemble Phase1 Holdings Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble scripts/update_holdings_cache.py from data/phase1_parts
        run: |
          set -e
          python3 <<'PY'
          import base64
          from pathlib import Path
          parts_dir = Path("data/phase1_parts")
          parts = sorted(parts_dir.glob("uh_*.b64"))
          if len(parts) < 5:
              raise SystemExit(f"need 5 parts, found {len(parts)}: {parts}")
          b64 = "".join(p.read_text().strip() for p in parts)
          raw = base64.b64decode(b64)
          path = Path("scripts/update_holdings_cache.py")
          path.write_bytes(raw)
          compile(raw.decode("utf-8"), str(path), "exec")
          assert b"PLACEHOLDER" not in raw
          assert b"compare_to_prior" in raw
          assert b"refresh_amfi_nav_cache" in raw
          assert b"data_quality" in raw
          print("assembled", path, len(raw), "from", [p.name for p in parts])
          PY
      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_holdings_cache.py
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Phase 1: AMC holdings diff, AMFI nav refresh, equity/FX quality flags"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
