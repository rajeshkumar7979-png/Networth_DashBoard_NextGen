name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["Refresh MF Holdings"]
    types: [completed]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip the holdings-triggered path when the holdings job itself failed.
    if: >
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install production + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Guard against placeholder / stub corruption
        run: python scripts/check_critical_files.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, default suite excludes network smoke)
        run: pytest
