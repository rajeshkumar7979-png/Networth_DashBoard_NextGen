name: Refresh MF Holdings

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
    - cron: "0 6 5-20 * *"
    - cron: "0 14 5-20 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Rebuild public sample workbook from synthetic CSVs
        run: |
          python - <<'PY'
          from pathlib import Path
          x = Path("data/Networth_Raw_Data.xlsx")
          if x.exists() and x.stat().st_size > 20000:
              print(f"Keeping committed book {x} ({x.stat().st_size} bytes)")
          else:
              import subprocess, sys
              raise SystemExit(subprocess.call([sys.executable, "scripts/build_sample_workbook.py"]))
          PY

      - name: Wire live equity marks (Upstox then Yahoo)
        run: python scripts/wire_marks.py

      - name: Refresh complete MF holdings
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_holdings_cache.py

      - name: Record build SHA for Cloud footer
        run: |
          git rev-parse HEAD > data/BUILD_SHA.txt
          echo "BUILD_SHA=$(cat data/BUILD_SHA.txt)"

      - name: Verify generated cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cache = Path("data/mf_holdings_cache.json")
          history = Path("data/portfolio_history.csv")
          xlsx = Path("data/Networth_Raw_Data.xlsx")
          if not cache.exists():
              raise SystemExit("ERROR: holdings cache was not created")
          data = json.loads(cache.read_text(encoding="utf-8"))
          funds = [k for k in data if str(k).isdigit() and data[k]]
          if not funds:
              raise SystemExit("ERROR: holdings cache is empty")
          if not history.exists():
              raise SystemExit("ERROR: portfolio_history.csv was not written")
          if not xlsx.exists():
              raise SystemExit("ERROR: workbook missing")
          size = xlsx.stat().st_size
          if size < 20000:
              blob = xlsx.read_bytes().upper()
              for bad in (b"KHANDELWAL", b"SATYANARAYAN", b"KAVITA KHANDELWAL"):
                  if bad in blob:
                      raise SystemExit(f"ERROR: personal name marker still in sample xlsx: {bad!r}")
          print(f"Funds: {len(funds)}  History: {history}  Book: {xlsx} ({size} bytes)")
          PY

      - name: Commit updated holdings cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/mf_holdings_cache.json \
            data/mf_holdings_meta.json \
            data/amfi_scheme_universe.json \
            data/amfi_nav_cache.json \
            data/holdings_change_summary.json \
            data/portfolio_history.csv \
            data/mf_snapshots \
            data/Networth_Raw_Data.xlsx \
            data/BUILD_SHA.txt \
            scripts/update_holdings_cache.py || true
          if git diff --cached --quiet; then
            echo "No holdings changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh complete MF holdings"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Re-runs checkout an old SHA; main may have moved — rebase then push
          git pull --rebase origin "${GITHUB_REF_NAME}" || git pull --rebase origin main
          git push origin "HEAD:${GITHUB_REF_NAME}"
