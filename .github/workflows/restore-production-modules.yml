name: Restore Production Critical Modules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and restore modules from b64 parts
        run: |
          set -e
          python3 <<'PY'
          import base64
          from pathlib import Path

          def join(prefix, n, dest):
              parts = []
              for i in range(n):
                  p = Path(f"data/restore_parts/{prefix}_{i:02d}.b64")
                  if not p.exists():
                      raise SystemExit(f"missing {p}")
                  parts.append(p.read_text().strip())
              raw = base64.b64decode("".join(parts))
              Path(dest).write_bytes(raw)
              compile(raw.decode("utf-8"), dest, "exec")
              assert b"PLACEHOLDER" not in raw
              print(dest, len(raw), "ok")

          join("research", 5, "lib/intelligence/research.py")
          join("mf", 4, "lib/mf_holdings.py")
          join("audit", 3, "scripts/daily_self_audit.py")
          PY
      - name: Commit restored modules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/intelligence/research.py lib/mf_holdings.py scripts/daily_self_audit.py
          git commit -m "RESTORE production modules: research CI fix + multi-source holdings + stale audit"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
