name: Apply Phase1 Holdings Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write update_holdings_cache.py from local recovery path
        run: |
          set -e
          # Restore script from last known structure via git history if needed,
          # then apply phase1 patches in-repo (no network to external).
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          # Minimal safety: refuse if file is a tiny placeholder
          p = Path("scripts/update_holdings_cache.py")
          if not p.exists() or p.stat().st_size < 1000:
              raise SystemExit(f"holdings script missing or tiny: {p}")

          src = p.read_text(encoding="utf-8")
          if "compare_to_prior" in src and "refresh_amfi_nav_cache" in src and "data_quality" in src:
              print("Phase 1 markers already present; size", len(src))
              raise SystemExit(0)

          # If markers missing, fail loudly — full body is applied by a follow-up
          # commit from the maintainer tree. This job is a guard, not a silent no-op.
          raise SystemExit(
              "Phase 1 markers missing in scripts/update_holdings_cache.py. "
              "Run Apply Phase1 Holdings Script v2 (embedded) or push the script."
          )
          PY
